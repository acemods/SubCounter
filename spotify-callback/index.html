<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SubCounter · Spotify</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:16px/1.5 -apple-system,system-ui,sans-serif}
  .card{max-width:440px;margin:20px;padding:26px;background:#1c1c1e;border-radius:16px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  code{display:block;word-break:break-all;background:#000;padding:10px;border-radius:8px;margin:12px 0;font-size:13px}
  button{border:0;border-radius:10px;padding:12px 18px;background:#1db954;color:#fff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div class="card" id="box"><h1>Connecting to your SubCounter…</h1></div>
<script>
// Spotify sends you here after you press Agree: ?code=...&state=http://<board IP>
// This page only forwards the code to a board on your own local network.
const q = new URLSearchParams(location.search);
const code = q.get('code'), error = q.get('error'), state = q.get('state') || '';
const box = document.getElementById('box');
const privateBoard = /^http:\/\/(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3})(:\d{1,5})?$/;
function show(title, text, copy) {
  box.innerHTML = '';
  const h = document.createElement('h1'); h.textContent = title; box.append(h);
  const p = document.createElement('p'); p.textContent = text; box.append(p);
  if (copy) {
    const c = document.createElement('code'); c.textContent = copy; box.append(c);
    const b = document.createElement('button'); b.textContent = 'Copy code';
    b.onclick = () => navigator.clipboard.writeText(copy).then(() => b.textContent = 'Copied ✓');
    box.append(b);
  }
}
if (error) show('Spotify not connected', 'Spotify said: ' + error);
else if (!code) show('Nothing to do here', 'Start from "Connect Spotify" on your SubCounter settings page.');
else if (privateBoard.test(state)) location.replace(state + '/spotify/callback?code=' + encodeURIComponent(code));
else show('Almost there', "Couldn't find your board automatically. Paste this code into the Spotify box on the board's settings page:", code);
</script>
</body>
</html>
